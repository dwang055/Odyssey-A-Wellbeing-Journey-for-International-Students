<style>
/* Layout: the Odyssey sky. Wordmark over a glowing peak, the world map as the spine, chapter cards beneath, the lighthouse as the finish. Single light world by choice, matching the original brand. */
:root{
  --bg:#e4eefb; --sky:#bcd6f5; --panel:#ffffff; --line:#cddbee; --ink:#17223a; --dim:#5a6a88;
  --accent:#3f74c4; --gold:#e3a63c; --forest:#3f9d6b; --cave:#4b5677; --snow:#c9a9b8; --calm:#257552;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Noto Sans SC",system-ui,sans-serif;
  --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:680px;margin:0 auto;padding-block:12px 32px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
button,a{font:inherit}
button{cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:5px 10px;font-size:13px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.help{background:var(--panel);border:1px solid var(--calm);color:var(--calm);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.zh{font-family:var(--zh)}
.l2{display:block;color:var(--dim);font-size:.9em;font-family:var(--zh)}
p{margin:0}
h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:22px}h3{font-size:19px}
.hero{position:relative;text-align:center;padding-block:28px 8px;display:flex;flex-direction:column;gap:10px;align-items:center}
.peak{width:150px;height:84px;position:relative}
.peak::before{content:"";position:absolute;left:50%;top:-24px;width:120px;height:120px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,#fff 0,rgba(255,255,255,.75) 35%,rgba(255,255,255,0) 70%)}
.peak svg{position:relative;width:100%;height:100%}
.word{font-family:var(--display);font-weight:700;font-size:clamp(36px,11vw,64px);letter-spacing:.38em;margin-right:-.38em;color:#fff;
  text-shadow:0 0 18px rgba(255,255,255,.9),0 2px 0 rgba(63,116,196,.35);line-height:1}
.tagline{font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;font-size:13px;color:#335fa3}
.sub{color:var(--dim);max-width:44ch}
.map{background:linear-gradient(#cfe0f6,#eaf1fb);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.isle{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;max-width:100%;background:linear-gradient(#a9b9dc,#d3dcee 60%,#c2d1e8);touch-action:pan-y}
.isle::before{content:"";position:absolute;inset:0;background:linear-gradient(#bfe0ff,#fff3d6 58%,#dff0fb);opacity:0;transition:opacity 2.5s}
.isle.lit::before{opacity:1}
.isle canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.isle-ui{position:absolute;inset:0;pointer-events:none}
.isle-st{position:absolute;left:0;top:0;pointer-events:auto;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;text-decoration:none;color:var(--ink);will-change:transform}
.isle-st .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--ink);font-family:var(--display);font-weight:700;font-size:15px}
.isle-st.done .n{background:var(--gold);border-color:#8a5d12}
.isle-st .t{font-family:var(--display);font-weight:700;font-size:13px;background:rgba(255,255,255,.9);padding:2px 9px;border-radius:999px;white-space:nowrap}
.isle-st:hover .n{transform:scale(1.1)}
.isle-st:nth-child(2) .t{transform:translateX(-30%)}
.isle-st:nth-child(3) .t{transform:translateX(30%)}
.isle-st:focus-visible{outline:none}.isle-st:focus-visible .n{outline:3px solid var(--accent);outline-offset:2px}
.isle-hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:var(--dim);background:rgba(255,255,255,.7);padding:2px 8px;border-radius:999px;pointer-events:none}
.isle-hint .l2{display:inline;margin-left:6px}
.hero .chiprow{justify-content:center}
.mapwrap{display:flex;flex-direction:column;gap:8px}
 .stage3{position:relative}
.map-out{position:absolute;top:10px;left:10px;font:inherit;font-size:13px;background:rgba(255,255,255,.9);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:32px}
.isle-st{background:none;border:0;padding:0;cursor:pointer;font:inherit}
.isle-st.shore .n,.isle-st.tower .n{font-size:15px}
.isle-st.sel .n{background:var(--ink);color:#fff;border-color:var(--ink);transform:scale(1.15)}
.isle-st.sel .t{background:var(--ink);color:#fff}
.steps{display:grid;grid-template-columns:repeat(5,1fr);position:relative;margin-top:2px}
.steps::before{content:"";position:absolute;left:10%;right:10%;top:17px;height:3px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.step{position:relative;background:none;border:0;padding:0 2px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--dim);min-width:0}
.step .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink)}
.step .nm{font-size:12px;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.step.done .dot{background:radial-gradient(circle at 35% 35%,#fff6d8,var(--gold));border-color:#c98a24}
.step.here .dot{box-shadow:0 0 0 4px rgba(63,116,196,.18)}
.step[aria-current="true"] .dot{background:var(--ink);color:#fff;border-color:var(--ink)}
.step[aria-current="true"] .nm{color:var(--ink);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--c,var(--accent))}
.p-kick{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--accent))}
.p-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.p-head h2{font-size:24px}
.p-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px;font-weight:700;color:var(--dim);white-space:nowrap;min-height:40px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c,var(--accent))}
.tabpane{display:flex;flex-direction:column;gap:10px;max-width:65ch}
.tabpane ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.idea{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.idea b{font-family:var(--display)}
.isle-note{font-size:14px;color:var(--dim);border-left:3px solid var(--c,var(--accent));padding-left:10px}
.skillmini{border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,#1c2a4a,#3f74c4);color:#fff}
.skillmini .l2{color:rgba(255,255,255,.82)}
.skillmini b{display:block;font-family:var(--display);color:#ffd27d;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.p-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.orig{display:flex;flex-direction:column;gap:6px}
.orig h3{font-size:15px;color:var(--dim);font-family:var(--body);font-weight:700}
.origrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.origlink{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);font-size:13px;background:var(--bg);border-radius:10px;padding:6px}
.origlink img{width:100%;aspect-ratio:1.4142;object-fit:cover;border-radius:6px;display:block;background:#dde5f2}

 {c:"#4b5677",ch:2,orig:[{p:35,t:{en:"Original script",zh:"原始脚本"}},{p:55,t:{en:"The 3D cave",zh:"3D 洞穴"}},{p:23,t:{en:"Research: the self",zh:"研究：自我"}}],short:{en:"Cave",zh:"映照之洞"},place:{en:"Cave of Reflections",zh:"映照之洞"},q:{en:"Who am I?",zh:"我是谁？"},
  summary:{en:"Inside a dark cave, harsh thoughts block the way like walls. You can't force them open. You open them by finding a kinder, more balanced way to say them.",zh:"在昏暗的洞穴里，苛刻的念头像墙一样挡住去路。你无法硬闯，只能找到一种更温和、更平衡的说法，让它们打开。"},
  doTitle:{en:"What you'll do",zh:"你会做什么"},
  do:[{en:"Find your way through a maze by the light of your lantern.",zh:"借着灯笼的光，在迷宫中找路。"},
      {en:"Answer four thought walls by choosing the reply that is both believable and kind.",zh:"回应四堵念头之墙：选出既可信又善待自己的回应。"},
      {en:"Collect five orbs of hope along the way.",zh:"沿途收集五束希望之光。"},
      {en:"Finish with a friend's-eye view: write what you would say to a friend with the same thought.",zh:"最后用朋友的眼光看：写下你会对有同样念头的朋友说什么。"}],
  ideas:[{t:{en:"The negative triad",zh:"消极三角"},d:{en:"Low mood tends to colour three things at once: how we see ourselves, the world and the future. The walls cover all three, plus identity.",zh:"低落情绪往往同时影响三件事：我们如何看待自己、世界和未来。这些墙涵盖了这三方面，另加身份认同。"}},
         {t:{en:"Balanced thinking",zh:"平衡的想法"},d:{en:"A balanced thought isn't forced positivity. It is true enough to believe and kind enough to help.",zh:"平衡的想法不是硬要积极，而是足够可信、也足够善意。"}},
         {t:{en:"The identity gap",zh:"身份落差"},d:{en:"Feeling like a different person in a second language is common. The gap narrows with practice.",zh:"用第二语言时觉得自己像变了一个人，这很常见。这种落差会随着练习缩小。"}},
         {t:{en:"Validation first",zh:"先理解，再回应"},d:{en:"Each thought is acknowledged before it is answered. Unfair treatment is named as unfair, never as a thinking error.",zh:"每个念头都先被理解，再被回应。不公平的对待会被明确指出是不公平的，而不会被当作“想法错误”。"}}],
  why:[{en:"Answering harsh thoughts with balanced ones is a core skill in cognitive behavioural therapy (CBT).",zh:"用平衡的想法回应苛刻的念头，是认知行为疗法（CBT）的核心技能。"},
       {en:"Treating yourself the way you would treat a friend is linked with less stress from settling into a new country.",zh:"像对待朋友那样对待自己，与更小的适应压力相关。"}],
  skill:{t:{en:"Answer the thought",zh:"回应念头"},d:{en:"Notice the thought. Ask: is it fair, or just harsh? Say the balanced version, the way you would to a friend.",zh:"留意这个念头。问自己：它公平吗，还是只是苛刻？像对朋友那样，说出平衡的版本。"}},
  island:{en:"On the island: finishing this chapter lights up crystals in the cave.",zh:"在小岛上：完成这一章，洞里的水晶会亮起来。"}},
 {c:"#a8667c",ch:3,orig:[{p:36,t:{en:"Original script and puzzles",zh:"原始脚本与谜题"}},{p:56,t:{en:"The 3D valley",zh:"3D 山谷"}},{p:24,t:{en:"Research: social identity",zh:"研究：社会身份"}}],short:{en:"Valley",zh:"光之谷"},place:{en:"Valley of Light",zh:"光之谷"},q:{en:"Who are they?",zh:"他们是谁？"},
  summary:{en:"In a snowy valley, your light stays bright only when it reaches someone. Mirrors and frosted thoughts stand between you and other people.",zh:"在雪谷里，只有照到别人，你的光才会一直明亮。镜子和结霜的念头挡在你和他人之间。"},
  doTitle:{en:"What you'll do",zh:"你会做什么"},
  do:[{en:"Turn mirrors to guide your beam to a classmate, a club, the students' association and family.",zh:"转动镜子，把光引向一位同学、一个社团、学生会和家人。"},
      {en:"Answer the frosted thoughts that keep you apart.",zh:"回应那些让你与人隔开的结霜念头。"},
      {en:"Watch your light energy: it drains when you're cut off and recharges when you connect.",zh:"留意光的能量：孤立时会减少，连接时会恢复。"},
      {en:"Collect a small step for each person, with a ready-made opening line.",zh:"为每个人收集一个小行动，附带现成的开场白。"}],
  ideas:[{t:{en:"Belonging",zh:"归属感"},d:{en:"The groups we belong to give us support, meaning and a sense of who we are.",zh:"我们所属的群体，给我们支持、意义和身份感。"}},
         {t:{en:"Pulling away",zh:"退缩"},d:{en:"Withdrawing feels safe in the moment, but it is one of the main ways low mood keeps itself going.",zh:"退缩在当下让人觉得安全，却是低落情绪持续下去的主要原因之一。"}},
         {t:{en:"Small steps",zh:"小步伐"},d:{en:"A hello, a message or ten minutes at a club is enough to start.",zh:"一声问候、一条消息、去社团待十分钟，就足以开始。"}},
         {t:{en:"报喜不报忧",zh:"报喜不报忧"},d:{en:"Many families share only good news. You can keep that kindness and still let them in a little.",zh:"很多家庭习惯只说好消息。你可以保留这份体贴，同时让他们走近一点。"}}],
  why:[{en:"Feeling connected is one of the strongest protections for wellbeing.",zh:"与人连接的感觉，是保护身心健康最有力的因素之一。"},
       {en:"Students in New Zealand research preferred turning to friends and family before services, so this chapter starts there. The help guide covers the rest.",zh:"新西兰的研究发现，学生更愿意先向朋友和家人求助，再找专业服务，所以这一章从这里开始。其余的内容在求助指南里。"}],
  skill:{t:{en:"Send a little light",zh:"送出一点光"},d:{en:"When you want to pull away, send one small signal instead.",zh:"想退缩的时候，换成发出一个小信号。"}},
  island:{en:"On the island: finishing this chapter brings flowers up through the snow.",zh:"在小岛上：完成这一章，花儿会从雪里探出头来。"}},
 {orig:[{p:41,t:{en:"Lighthouse sketch",zh:"灯塔草图"}},{p:49,t:{en:"Final results",zh:"最终成果"}},{p:50,t:{en:"The finished world",zh:"完成的世界"}}],c:"#c98a24",short:{en:"Lighthouse",zh:"灯塔"},place:{en:"The Lighthouse",zh:"灯塔"},q:{en:"A new beginning",zh:"新的开始"},
  summary:{en:"The lighthouse on the peak went dark long ago. Bring the three orbs of knowledge here to light it again.",zh:"山顶上的灯塔早已熄灭。把三颗知识之球带到这里，让它重新亮起。"},
  doTitle:{en:"What happens here",zh:"在这里会发生什么"},
  do:[{en:"Collect the orb from each chapter.",zh:"从每一章收集一颗光球。"},
      {en:"Light the lighthouse. Your traveller climbs to the top, and the light reaches the whole island.",zh:"点亮灯塔。旅人登上塔顶，灯光照亮整座小岛。"}],
  ideas:[{t:{en:"Where am I?",zh:"我在哪里？"},d:{en:"Your strengths from home came with you.",zh:"你在家乡练就的力量，也跟着你来了。"}},
         {t:{en:"Who am I?",zh:"我是谁？"},d:{en:"A thought is something you notice, not something you have to obey.",zh:"念头是你可以留意的东西，而不是必须服从的命令。"}},
         {t:{en:"Who are they?",zh:"他们是谁？"},d:{en:"Connection recharges you, even in small steps.",zh:"与人连接会给你充电，哪怕只是一小步。"}}],
  why:[{en:"Healing isn't a straight path. Come back to any chapter whenever you need it.",zh:"疗愈不是一条直线。需要的时候，随时回到任何一章。"},
       {en:"If things feel heavy for more than two weeks, talk to someone. The help guide below explains how.",zh:"如果沉重的感觉持续两周以上，请找人聊一聊。下面的求助指南会告诉你怎么做。"}],
  island:{en:"On the island: the beam sweeps across every place you have been.",zh:"在小岛上：灯光扫过你去过的每一个地方。"}},
];

const GUIDE=[
 {q:{en:"Where do I start?",zh:"从哪里开始？"},
  a:[{en:"Your university has a health and counselling service for enrolled students. Counselling is often free. Ask when you book, and bring your student ID.",zh:"你的大学为在读学生提供健康和心理辅导服务，心理辅导通常免费。预约时问清楚，并带上学生证。"},
     {en:"International student advisers can also help you find the right service.",zh:"国际学生顾问也可以帮你找到合适的服务。"}]},
 {q:{en:"How do I know it's more than homesickness?",zh:"怎么知道这不只是想家？"},
  a:[{en:"Feeling low, tired or homesick now and then is a normal part of settling in. It's worth talking to someone when it lasts longer than two weeks and gets in the way of everyday life.",zh:"偶尔情绪低落、疲倦或想家，是适应过程中的正常现象。如果这种状态持续两周以上，并且影响到日常生活，就值得找人聊一聊。"},
     {en:"Signs to notice: low mood most of the time, losing interest in things you used to enjoy, trouble concentrating, or feeling worthless or hopeless.",zh:"需要留意的迹象：大部分时间情绪低落，对以前喜欢的事失去兴趣，难以集中注意力，或觉得自己没用、没有希望。"},
     {en:"Distress often shows up in the body first: sleeping much more or less, constant tiredness, changes in appetite, headaches or stomach aches.",zh:"心理上的困扰往往先表现在身体上：睡得太多或太少、持续疲倦、食欲改变、头痛或胃痛。"},
     {en:"Only a health professional can say whether it is depression. If you have thoughts of harming yourself, call or text 1737 now, or call 111 in an emergency.",zh:"是否是抑郁症，只有专业医护人员才能判断。如果你有伤害自己的念头，请立即拨打或发短信至1737；紧急情况请拨打111。"}]},
 {q:{en:"What is a GP?",zh:"什么是 GP（家庭医生）？"},
  a:[{en:"In New Zealand you usually see a GP (general practice doctor) first, for your body and your mental health. They can refer you to other services if needed.",zh:"在新西兰，无论身体还是心理问题，通常先看 GP（家庭医生）。需要时，他们会把你转介到其他服务。"},
     {en:"In many countries people go straight to a hospital or specialist. Here, the GP is the usual first step. Most campus health centres have GPs.",zh:"在很多国家，人们会直接去医院或找专科医生。在这里，GP 通常是第一步。大多数校园健康中心都有 GP。"}]},
 {q:{en:"Who pays?",zh:"费用由谁承担？"},

     {en:"Conditions you had before arriving are usually not covered unless you declared them and the insurer accepted them. Check what your policy says about mental health.",zh:"来新西兰之前就有的疾病，通常只有在申报并被保险公司接受后才在保障范围内。请查看你的保单对心理健康的规定。"}]},
 {q:{en:"What is counselling like?",zh:"心理辅导是什么样的？"},
  a:[{en:"It's a private conversation with a trained counsellor. You decide what to talk about and how much to share. It isn't a test, and you won't be judged for how you feel.",zh:"这是一次与专业辅导员的私密谈话。谈什么、说多少，由你决定。这不是考试，也没有人会因为你的感受评判你。"},
     {en:"If a counsellor isn't a good fit, you can ask to see someone else.",zh:"如果觉得辅导员不合适，你可以要求换一位。"}]},
 {q:{en:"What do I say when I book?",zh:"预约时该怎么说？"},
  a:[{en:"You don't need perfect English or the right medical words. One or two plain sentences are enough, and you can write them down first.",zh:"你不需要完美的英语，也不需要专业的医学词汇。一两句简单的话就够了，可以先写下来。"}],
  say:[{en:"I'd like to make an appointment with a counsellor, please.",zh:"我想预约一位心理辅导员。"},
       {en:"I've been feeling low and not sleeping well for a few weeks.",zh:"这几周我情绪低落，睡得也不好。"},
       {en:"I'm an international student. Is there a cost?",zh:"我是国际学生，需要收费吗？"},

 {q:{en:"Will anyone find out?",zh:"会有人知道吗？"},
  a:[{en:"Health information is protected by the Privacy Act 2020 and the Health Information Privacy Code. Counsellors keep what you say confidential.",zh:"健康信息受《2020年隐私法》和《健康信息隐私守则》保护。辅导员会对你说的话保密。"},
     {en:"The main exception is serious danger to you or someone else. Then some information may be shared, for example with a doctor or emergency services. Otherwise your information isn't shared without your agreement.",zh:"主要的例外是你或他人面临严重危险时，部分信息可能会被告知医生或紧急服务。除此之外，未经你同意，信息不会被分享。"}]},
 {q:{en:"Will it affect my visa?",zh:"会影响我的签证吗？"},

 {q:{en:"What are my rights?",zh:"我有哪些权利？"},

     {en:"A friend can come with you to an appointment, or help you explain things.",zh:"朋友可以陪你去预约，或帮你解释情况。"}]},
 {q:{en:"What if someone treats me unfairly?",zh:"如果有人不公平地对待我怎么办？"},
  a:[{en:"Being treated badly because of your nationality, race or accent is discrimination. It is not your fault, and it is not something you have to get used to.",zh:"因为国籍、种族或口音而受到恶劣对待，属于歧视。这不是你的错，你也不必去“习惯”它。"},
     {en:"Tell someone. Your international student support team can help, and many students' associations have free advocates who are independent of the university.",zh:"把这件事告诉别人。国际学生支持团队可以帮助你；很多学生会也有独立于学校的免费申诉顾问。"},
     {en:"If the problem is with your education provider and their complaints process doesn't resolve it, Study Complaints | Ngā Amuamu Tauira is a free, independent service: 0800 00 66 75.",zh:"如果问题出在你的学校，而学校的投诉程序没能解决，可以联系 Study Complaints | Ngā Amuamu Tauira，这是一项免费、独立的服务：0800 00 66 75。"},
     {en:"Te Kāhui Tika Tangata, the Human Rights Commission, has a dispute resolution service for people who believe their rights have been breached: tikatangata.org.nz.",zh:"人权委员会（Te Kāhui Tika Tangata）为认为自身权利受到侵犯的人提供争议解决服务：tikatangata.org.nz。"},

     {en:"Feelings are hard to explain in a second language. It's fine to ask a service whether an interpreter is available.",zh:"用第二语言表达感受很难。你可以直接问服务机构是否能提供翻译。"}]},

let openGuide=new Set();
function renderGuide(){
  const g=document.getElementById("guide");
  g.innerHTML=`<h2 id="guideTitle">${L({en:"How help works here",zh:"在这里如何求助"})}</h2>
    <p class="small">${L({en:"Getting help in a new country is harder when the system is unfamiliar. Here's what to expect.",zh:"在陌生的体系里求助会更难。以下是你可以预期的情况。"})}</p>
    ${GUIDE.map((it,i)=>`<details data-g="${i}" ${openGuide.has(i)?"open":""}><summary><span>${L(it.q)}</span></summary><div class="body">${it.a.map(x=>`<p>${L(x)}</p>`).join("")}${(it.say||[]).map(x=>`<p class="say"><strong lang="en">${esc(x.en)}</strong>${lang!=="en"?`<span class="gl" lang="zh-Hans">${esc(x.zh)}</span>`:""}</p>`).join("")}${i===0&&campusOn()?campusBlock("cnum"):""}</div></details>`).join("")}
    <p class="src">${L({en:"Checked November 2026. Details change, so confirm with your university.",zh:"2026年11月核对。信息可能变化，请向你的大学确认。"})} ${GSRC.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join(" · ")}</p>`;
  g.querySelectorAll("details").forEach(d=>d.addEventListener("toggle",()=>{const i=+d.dataset.g;d.open?openGuide.add(i):openGuide.delete(i)}));
  g.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const sel=()=>{const n=b.parentElement.querySelector(".cnum"),r=document.createRange();r.selectNodeContents(n);const x=getSelection();x.removeAllRanges();x.addRange(r)};
    try{navigator.clipboard.writeText(b.dataset.copy).then(()=>{b.innerHTML=L(T.copied)},sel)}catch(e){sel()}});
}

const doneCount=p=>[1,2,3].filter(n=>p["c"+n]).length;
function defaultStage(p){const k=doneCount(p);if(p.lit||k===3)return 4;if(!k)return 0;return [1,2,3].find(n=>!p["c"+n])}

function renderOut(){const b=document.getElementById("mapOut");b.hidden=!zoomed||!island;b.textContent=P(T.mapOut);b.onclick=()=>{zoomed=false;island&&island.select(null);renderOut()}

function renderSteps(p){
  const here=defaultStage(p);
  document.getElementById("steps").innerHTML=STAGES.map((st,i)=>{
    const done=st.ch?!!p["c"+st.ch]:i===4?!!p.lit:doneCount(p)>0;

      <span class="dot" aria-hidden="true">${st.ch?st.ch:i===0?"⚓":"✦"}</span><span class="nm">${esc(P(st.short))}</span></button>`}).join("");

function renderPanel(p){

  let pane="";

    ${st.skill?`<div class="skillmini"><b>${L(T.youLeave)}</b>${L(st.skill.t)} · ${L(st.skill.d)}</div>`:""}
    ${HAS_CONCEPT&&st.orig?`<div class="orig"><h3>${L(T.origFrom)}</h3><div class="origrow">${st.orig.map(o=>`<a class="origlink" href="concept.html#p${o.p}"><img src="concept/t${String(o.p).padStart(2,"0")}.webp" alt="" loading="lazy" width="320" height="226"><span>${esc(P(o.t))} · p${o.p}</span></a>`).join("")}</div></div>`:""}
    ${sel===0?`<p class="isle-note">${L(T.jn[lit?4:Math.min(3,(p.heal||[]).filter(n=>p["c"+n]).length)])}</p>`:`<p class="isle-note">${L(st.island)}</p>`}`;
  if(tab==="ideas")pane=st.ideas.map(x=>`<div class="idea"><b>${L(x.t)}</b><span>${L(x.d)}</span></div>`).join("");

  let act="";
  if(st.ch){const ch=CH[st.ch-1];act=`<a class="btn ${done?"ghost":""}" href="${ch.href}">${L(done?T.replay:T.start)}</a>`}
  else if(sel===0){const nx=CH.find(c=>!p["c"+c.n])||CH[0];act=`<a class="btn" href="${nx.href}">${L(T.start)} · ${esc(P(nx.place))}</a>`}
  else{
    act=`<div class="orbs" aria-label="${k} / 3">${CH.map(c=>`<span class="orb ${p["c"+c.n]?"on":""}"></span>`).join("")}<span class="small" style="align-self:center">${k} / 3 ${esc(P(T.orbsOf))}</span></div>
      ${lit?`<p class="isle-note">${L(T.litEnd)}</p>`:`<button class="btn gold" id="lightBtn" type="button" ${k<3||lighting?"disabled":""}>${L(T.light)}</button>`}`;

    <div class="p-actions">${act}</div>
    <div class="p-nav"><button type="button" id="pPrev" ${sel===0?"disabled":""}>${esc(P(T.prev))}</button><button type="button" id="pNext" ${sel===4?"disabled":""}>${esc(P(T.next))}</button></div>

  document.getElementById("pTop").onclick=()=>document.querySelector(".stage3").scrollIntoView({behavior:FX.RM?"auto":"smooth",block:"start"});

  document.getElementById("pPrev").onclick=()=>select(sel-1,{keepZoom:true});document.getElementById("pNext").onclick=()=>select(sel+1,{keepZoom:true});

/* returning from a chapter: that part of the island blooms, and the traveller heals a step */
let blooming=false;
async function bloom(){
  const p0=prog(),list=pendingOf(p0);if(!list.length||blooming)return;
  if(!island||FX.RM){const q=prog();q.heal=[...new Set([...(q.heal||[]),...list])];save(q);render();return}
  blooming=true;island.busy(true);const healed=(p0.heal||[]).filter(n=>p0["c"+n]);
  for(const n of list){sel=n;tab="about";zoomed=true;island.select(n);renderSteps(prog());renderPanel(prog());
    await island.walkTo(n-1);FX.sfx("orb");await island.absorb(n-1);FX.sfx("connect");
    healed.push(n);island.setHeal(healed.length/3);await island.healRegion(n-1);
    const q=prog();q.heal=[...new Set([...(q.heal||[]),n])];save(q)}
  await island.walkTo(restOf(prog()));island.busy(false);blooming=false;render();
}
async function lightTower(b){
  if(lighting)return;lighting=true;b.disabled=true;
  document.querySelector(".stage3").scrollIntoView({behavior:FX.RM?"auto":"smooth",block:"center"});
  if(island){island.busy(true);island.setHeal(1);zoomed=true;island.select(4);await island.walkTo(3);FX.sfx("lighthouse");await new Promise(r=>island.light(r));island.celebrate()}
  else FX.sfx("lighthouse");
  const q=prog();q.lit=Date.now();q.heal=[1,2,3];save(q);litNow=true;lighting=false;
  if(island)island.busy(false);render();
}

function render(){

/* ---------- 3D island: loads after the page is usable; the flat map stays if 3D is unavailable ---------- */
function loadIsland(){
  const el=document.getElementById("isle"),flat=document.getElementById("map");if(!el||island)return;
  try{const c=document.createElement("canvas");if(!(c.getContext("webgl2")||c.getContext("webgl")))return}catch(e){return}

  const go=()=>add("odyssey-island.js",()=>{try{
    el.hidden=false;
