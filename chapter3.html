<style>
/* Layout: a snowy valley at dusk. One light world by choice (Chapter 3 is snow and low sun); the puzzle board sits on top, status above it, story below. */
:root{
  --bg:#eef0f5; --panel:#ffffff; --line:#d5d9e4; --ink:#1d2333; --dim:#5f6880;
  --beam:#e9a93b; --person:#d5707f; --ice:#9cc6e6; --calm:#2b7a5e; --dusk:#c9a9b8;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Noto Sans SC",system-ui,sans-serif;
  --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:600px;margin:0 auto;padding-block:12px 24px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);letter-spacing:.14em;font-size:12px;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 220px}
.brand .l2{display:none}
.brand b{color:var(--ink)}
.tools{display:flex;gap:6px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:2px solid var(--beam);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:5px 10px;font-size:13px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.help{background:var(--panel);border:1px solid var(--calm);color:#24684f;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.zh{font-family:var(--zh)}
.l2{display:block;color:var(--dim);font-size:.9em;font-family:var(--zh)}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,7vw,40px);letter-spacing:.04em}
h2{font-size:22px}
p{margin:0}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#875810}
.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.erow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-size:13px;color:var(--dim)}
.status .l2,.erow .l2{display:inline;margin-left:6px}
.status strong{color:var(--ink)}
.energy{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.energy i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f3c76a,var(--beam));transition:width .3s}
.stage{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#dfe5ee}
canvas{display:block;width:100%;height:auto;cursor:pointer;touch-action:manipulation}
.story{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--beam);border-radius:10px;padding:10px 12px;min-height:58px;font-size:15px}
.story.cold{border-left-color:var(--ice)}
.story.warm{border-left-color:var(--calm)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;text-align:center}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:14px}
.row .btn{flex:1 1 180px}
.note{font-size:12px;color:var(--dim);text-align:center}
.small{font-size:13px;color:var(--dim)}
.veil{position:fixed;inset:0;background:rgba(25,30,45,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.veil{align-items:center}}
.sheet{background:var(--panel);border-radius:16px;max-width:540px;width:100%;max-height:calc(100% - 8px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.quote{font-size:18px;color:#3f6f95;border-left:3px solid var(--ice);padding-left:12px}
.valid{font-size:15px;color:#22604a}
.say{border-left:3px solid var(--beam);padding-left:10px;display:flex;flex-direction:column;gap:2px}
.say .gl{color:var(--dim);font-size:14px}
.say .l2{display:inline;margin-left:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;font-size:15px}
.opt.no{border-color:var(--person)}
.opt.yes{border-color:var(--calm);background:#e8f5ef}
.fb{font-size:14px;border-radius:10px;padding:10px 12px;background:var(--bg)}
.fb.no{color:#8f3a46}.fb.yes{color:#22604a}
.tag{display:inline-block;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor;margin-bottom:4px}
.meet{display:flex;flex-direction:column;gap:10px}
.person{border:1px solid var(--line);border-top:3px solid var(--person);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.person h3{font-size:17px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;text-align:left}
.chip[aria-pressed="true"]{background:var(--calm);border-color:var(--calm);color:#fff}
.chip[aria-pressed="true"] .l2{color:rgba(255,255,255,.85)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
textarea{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical;box-sizing:border-box}
.plan{margin:0;padding-left:18px}
.contacts{display:flex;flex-direction:column;gap:8px}
.contact{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:10px 12px}
.contact .num{font-family:var(--display);font-size:20px;color:#24684f;user-select:all;white-space:nowrap}
.warmfb{font-size:14px;border-radius:10px;padding:10px 12px;background:#e8f5ef;color:#22604a}

.skill{border-radius:14px;padding:16px;background:linear-gradient(135deg,#1c2a4a,#3f74c4);color:#fff;display:flex;flex-direction:column;gap:6px}
.skill .l2{color:rgba(255,255,255,.82)}
.skill-k{font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#ffd27d}
.skill-t{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.2}
.skill-f{font-family:var(--display);font-size:11px;letter-spacing:.2em;opacity:.7;margin-top:4px}
.share{display:flex;flex-direction:column;gap:8px}
</style>

function trace(){
  const pts=[];let x=source.x,y=source.y,dx=1,dy=0,guard=0;const hit=new Set();let blockedBy=null;

    if(c==="I"){pts.push([x+.5-dx*.5,y+.5-dy*.5]);blockedBy=x+","+y;break}

const rnd=(x,y,s=0)=>{let h=(x*374761393+y*668265263+s*1442695041)>>>0;h=Math.imul(h^(h>>>13),1274126177)>>>0;return (h&1023)/1023};

function draw(now){

    const a=rnd(x,y)*6;tri([px,py],[px+cell,py],[px,py+cell],`hsl(220,22%,${92+a*.6}%)`);tri([px+cell,py],[px+cell,py+cell+.5],[px,py+cell+.5],`hsl(220,20%,${88+a*.5}%)`);
    if(c==="#"){const m=cell*.1;tri([px+m,py+cell-m],[px+cell*.45,py+m*1.5],[px+cell-m,py+cell-m],"#8c92a6");tri([px+cell*.45,py+m*1.5],[px+cell-m,py+cell-m],[px+cell*.62,py+cell-m],"#727a90");
      tri([px+cell*.36,py+cell*.3],[px+cell*.45,py+m*1.5],[px+cell*.55,py+cell*.3],"#f3f5f9");}
    if(c==="I"){ctx.fillStyle="rgba(156,198,230,.85)";ctx.fillRect(px+cell*.08,py+cell*.08,cell*.84,cell*.84);
      ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(px+cell*.2,py+cell*.3);ctx.lineTo(px+cell*.5,py+cell*.5);ctx.lineTo(px+cell*.35,py+cell*.8);ctx.moveTo(px+cell*.5,py+cell*.5);ctx.lineTo(px+cell*.8,py+cell*.25);ctx.stroke();
      ctx.fillStyle="#2f5f86";ctx.font=`700 ${cell*.32}px "Chakra Petch",sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("?",px+cell*.7,py+cell*.68);}
    if(c==="F"||c==="B"){
      const f=flash.find(q=>q.x===x&&q.y===y);const k=f?Math.max(0,1-(now-f.t)/300):0;
      ctx.fillStyle="#c9ced9";ctx.beginPath();ctx.arc(px+cell/2,py+cell/2,cell*.36,0,7);ctx.fill();
      ctx.strokeStyle="#a6adbd";ctx.lineWidth=2;ctx.stroke();
      ctx.save();ctx.translate(px+cell/2,py+cell/2);ctx.rotate((c==="F"?-1:1)*Math.PI/4+(c==="F"?1:-1)*k*Math.PI/2);
      ctx.fillStyle="#f7f9fc";ctx.fillRect(-cell*.4,-cell*.06,cell*.8,cell*.12);ctx.fillStyle="#6f7890";ctx.fillRect(-cell*.4,cell*.03,cell*.8,cell*.04);ctx.restore();}
    if(c==="T"){const key=x+","+y,on=lit.has(key);const cx=px+cell/2,cy=py+cell/2;
      const wv=warm[key]=RM?(on?1:0):(warm[key]||0)+((on?1:0)-(warm[key]||0))*.07;
      if(wv>.02){const gl=ctx.createRadialGradient(cx,cy,0,cx,cy,cell*.75);gl.addColorStop(0,`rgba(255,214,130,${.85*wv})`);gl.addColorStop(1,"rgba(255,214,130,0)");ctx.fillStyle=gl;ctx.fillRect(px-cell*.25,py-cell*.25,cell*1.5,cell*1.5)}
      if(wv<.98){ctx.strokeStyle=`rgba(79,88,112,${.6*(1-wv)})`;ctx.lineWidth=1.5;ctx.setLineDash([3,4]);ctx.lineDashOffset=-t*6;ctx.beginPath();ctx.arc(cx,cy,cell*.4,0,7);ctx.stroke();ctx.setLineDash([])}
      const mix=(a,b)=>Math.round(a+(b-a)*wv);ctx.fillStyle=`rgb(${mix(79,201)},${mix(88,84)},${mix(112,104)})`;
      const sc=1+.12*wv;ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-cx,-cy);
      ctx.beginPath();ctx.arc(cx,cy-cell*.14,cell*.13,0,7);ctx.fill();
      ctx.beginPath();ctx.moveTo(cx-cell*.2,cy+cell*.3);ctx.quadraticCurveTo(cx,cy-cell*.08,cx+cell*.2,cy+cell*.3);ctx.closePath();ctx.fill();ctx.restore();}
    if(c==="S"){const cx=px+cell/2,cy=py+cell/2;const gl=ctx.createRadialGradient(cx,cy,0,cx,cy,cell*.6);gl.addColorStop(0,"rgba(255,226,150,1)");gl.addColorStop(1,"rgba(255,210,125,0)");
      ctx.fillStyle=gl;ctx.fillRect(px-cell*.1,py-cell*.1,cell*1.2,cell*1.2);FX.drawTraveller(ctx,cx-cell*.2,cy+cell*.42,cell*.88,{heal:healV,t,face:1,glow:!dim});}
  }
  healV+=((allSolved&&!DONE0?Math.min(1,H0+1/3):H0)-healV)*(RM?1:.03);
  // melting frost
  melts=melts.filter(m=>now-m.t<900);melts.forEach(m=>{const k=(now-m.t)/900,s=cell*.84*(1-k);ctx.fillStyle=`rgba(156,198,230,${.85*(1-k)})`;ctx.fillRect(m.x*cell+cell/2-s/2,m.y*cell+cell/2-s/2+k*cell*.2,s,s)});
  // beam
  const alpha=dim?.15:Math.max(.25,energy/100);
  ctx.lineCap="round";ctx.lineJoin="round";
  const path=()=>{ctx.beginPath();beam.pts.forEach((p,i)=>i?ctx.lineTo(p[0]*cell,p[1]*cell):ctx.moveTo(p[0]*cell,p[1]*cell))};
  path();ctx.strokeStyle=`rgba(255,200,100,${alpha*.45})`;ctx.lineWidth=cell*.28*(1+(lit.size?.18*Math.sin(t*4):0));ctx.stroke();
  path();ctx.strokeStyle=`rgba(233,169,59,${alpha})`;ctx.lineWidth=cell*.08;ctx.stroke();
  path();ctx.setLineDash([cell*.12,cell*.22]);ctx.lineDashOffset=-t*cell*.8;ctx.strokeStyle=`rgba(255,250,235,${alpha})`;ctx.lineWidth=cell*.04;ctx.stroke();ctx.setLineDash([]);
  // falling snow and bursts
  if(!RM&&Math.random()<.2)parts.spawn(Math.random()*W,-4,1,{angle:Math.PI/2,spread:.5,speed:26,life:H/20,size:1.8,color:"255,255,255",drag:1});
  parts.draw(ctx,dt);
  const fk=1-(now-fadeT)/500;if(fk>0&&!RM){ctx.fillStyle=`rgba(238,240,245,${fk})`;ctx.fillRect(0,0,W,H)}
  if(showCursor&&document.activeElement===cv){ctx.strokeStyle="#1d2333";ctx.lineWidth=2;ctx.strokeRect(cursor.x*cell+2,cursor.y*cell+2,cell-4,cell-4)}
  requestAnimationFrame(draw);
}

/* ---------- story ---------- */
const story=document.getElementById("story");
function setStory(k,o){storyState=[k,o];story.className="story"+(k?" "+k:"");story.innerHTML=L(o)}

/* ---------- sheets ---------- */
const veil=document.getElementById("veil"),sheet=document.getElementById("sheet");
let redrawSheet=null,closable=true,returnFocus=null;
function openSheet(render,canClose=true){closable=canClose;returnFocus=document.activeElement;redrawSheet=render;veil.hidden=false;render();sheet.querySelector("button,textarea")?.focus()}

function intro(){
  openSheet(()=>{sheet.innerHTML=`<div class="eyebrow">${L(T.chapter)}</div><h1>${L(T.introTitle)}</h1>
    <p>${L(T.introBody)}</p><p><strong>${L(T.introRule)}</strong></p><p class="small">${L(T.introHow)}</p><p class="small">${L(T.privacy)}</p>

    <button class="btn" id="b-go">${L(T.begin)}</button>`;
    sheet.querySelector("#b-go").onclick=()=>{closeSheet();cv.focus();};},false);

function face(x,y){
  const th=THOUGHTS[iceAt[x+","+y]];let picked=null;
  openSheet(()=>{
    const o=th.opts,good=picked!=null&&o[picked].ok;
    sheet.innerHTML=`<div><span class="tag" style="color:#3f6f95">${L(th.kind)}</span><h2>${L(T.faceTitle)}</h2></div>
      <p class="quote">“${L(th.text)}”</p>${th.valid?`<p class="valid">${L(th.valid)}</p>`:""}<p>${L(T.pick)}</p>
      <div class="opts">${o.map((op,i)=>`<button class="opt ${picked===i?(op.ok?"yes":"no"):""}" data-i="${i}" ${good?"disabled":""}>${L(op.t)}</button>`).join("")}</div>
      ${picked!=null?`<div class="fb ${o[picked].ok?"yes":"no"}" tabindex="-1">${L(o[picked].fb)}</div>`:""}
      ${good?`<button class="btn" id="b-cont">${L(T.continue)}</button>`:picked!=null?`<p class="small">${L(T.tryAgain)}</p>`:""}`;
    sheet.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{picked=+b.dataset.i;FX.sfx(o[picked].ok?"chime":"soft");redrawSheet();(sheet.querySelector("#b-cont")||sheet.querySelector(".fb"))?.focus()});
    const c=sheet.querySelector("#b-cont");
    if(c)c.onclick=()=>{melts.push({x,y,t:performance.now()});parts.spawn((x+.5)*cell,(y+.5)*cell,30,{angle:Math.PI/2,spread:2,speed:40,gravity:140,life:1,size:2.4,color:"120,170,215"});FX.sfx("dissolve");grid[y][x]=".";energy=Math.min(100,energy+20);dim=false;closeSheet();setStory("warm",T.melted);afterChange();if(!solved)setStory("warm",T.melted)};
  },true);
}
function meet(){
  const ids=LEVELS[li].people;
  openSheet(()=>{
    sheet.innerHTML=`<div class="eyebrow">${L(T.valley)} ${li+1} / ${LEVELS.length}</div><h2>${L(T.metTitle)}</h2>
      <div class="meet">${ids.map(id=>{const p=PEOPLE[id],on=plan.includes(id);return `<div class="person"><h3>${L(p.name)}</h3><p>${L(p.scene)}</p>${sayHTML(p.say)}
        <div><button class="chip" data-p="${id}" aria-pressed="${on}">${on?"✓ ":"+ "}${L(p.step)}</button></div></div>`}).join("")}</div>

function ending(){markDone(3);
  openSheet(()=>{
    sheet.innerHTML=`<div class="orbwin" aria-hidden="true"></div><div class="eyebrow">${L(T.chapter)}</div><h2>${L(T.endTitle)}</h2><p>${L(T.endBody)}</p>
      <div><strong>${L(T.planTitle)}</strong></div>

function support(back){
  openSheet(()=>{
    const c=(num,label)=>`<div class="contact"><div>${L(label)}</div><div class="row" style="flex-wrap:nowrap;align-items:center"><span class="num">${num}</span><button class="chip" data-copy="${num}">${L(T.copy)}</button></div></div>`;
    sheet.innerHTML=`<h2>${L(T.supTitle)}</h2><p>${L(T.supBody)}</p>
      <div class="contacts">${c("1737",T.s1737)}${c("0800 862 342",T.sAFS)}${c("0800 543 354",T.sLife)}${c("111",T.s111)}</div>
      ${campusBlock("num")}<p class="small">${L(T.lang)}</p>
      <button class="btn" id="b-close">${L(T.close)}</button>`;
    sheet.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{
      const sel=()=>{const n=b.parentElement.querySelector(".num"),r=document.createRange();r.selectNodeContents(n);const s=getSelection();s.removeAllRanges();s.addRange(r)};
      try{navigator.clipboard.writeText(b.dataset.copy).then(()=>{b.innerHTML=L(T.copied)},sel)}catch(e){sel()}});
    sheet.querySelector("#b-close").onclick=()=>{back?back():closeSheet()};
  },true);
}
document.getElementById("helpBtn").onclick=()=>{

const WHEN={q:{en:"When will you do it? A plan with a set time is far more likely to happen.",zh:"打算什么时候做？定好时间的计划，更容易实现。"},label:{en:"When",zh:"时间"},
  opts:[{en:"Today",zh:"今天"},{en:"Tomorrow",zh:"明天"},{en:"This weekend",zh:"这个周末"},{en:"After my next class",zh:"下次课后"}]};
let whenIdx=null;
function whenHTML(cls){return `<div>${L(WHEN.q)}</div><div class="${cls}">${WHEN.opts.map((s,i)=>`<button class="chip" data-w="${i}" aria-pressed="${whenIdx===i}">${L(s)}</button>`).join("")}</div>`}
function wireWhen(){sheet.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{whenIdx=+b.dataset.w;redrawSheet()})}
const whenLine=()=>whenIdx==null?[]:[{en:WHEN.label.en+": "+WHEN.opts[whenIdx].en,zh:WHEN.label.zh+"："+WHEN.opts[whenIdx].zh}];
const SKILL={title:{en:"Send a little light",zh:"送出一点光"},body:{en:"When you want to pull away, send one small signal instead: a hello, a message, ten minutes at a club. Connection recharges you.",zh:"想退缩的时候，换成发出一个小信号：打个招呼、发条消息、去社团待十分钟。连接会给你充电。"},friend:{en:"Swap plans, then check in with each other next week.",zh:"交换计划，下周互相问问进展。"}};
const SHARE={copyBtn:{en:"Copy my plan to send to a friend",zh:"复制我的计划，发给朋友"},copied:{en:"Copied. Paste it into a message.",zh:"已复制，粘贴到消息里吧。"},manual:{en:"Select and copy this text:",zh:"选中并复制以下文字："},shot:{en:"Screenshot this card to keep it.",zh:"截图保存这张卡片。"},friend:{en:"Playing with a friend?",zh:"和朋友一起玩？"},planHead:{en:"My Odyssey plan this week",zh:"我这周的 Odyssey 计划"},skill:{en:"Skill",zh:"技能"}};
function skillCardHTML(sk){return `<div class="skill"><div class="skill-k">${L(SHARE.skill)}</div><div class="skill-t">${L(sk.title)}</div><div>${L(sk.body)}</div><div class="skill-f">ODYSSEY · ${L(T.chapter)}</div></div><p class="small">${L(SHARE.shot)}</p>`}
function planText(lines,sk){const pick=o=>o.own?o.own:(lang==="zh"?o.zh:(lang==="both"?o.en+" / "+o.zh:o.en));return [pick(SHARE.planHead)+":",...lines.map(l=>"• "+pick(l)),"",pick(sk.title)+": "+pick(sk.body)].join("\n")}
function shareHTML(sk){return `<div class="share"><p><strong>${L(SHARE.friend)}</strong> ${L(sk.friend)}</p><button class="btn ghost" id="b-share">${L(SHARE.copyBtn)}</button><div id="shareOut" aria-live="polite"></div></div>`}
function wireShare(getLines,sk){const b=sheet.querySelector("#b-share");if(!b)return;b.onclick=()=>{const txt=planText(getLines(),sk),out=sheet.querySelector("#shareOut");
  const manual=()=>{out.innerHTML=`<p class="small">${L(SHARE.manual)}</p><textarea readonly style="min-height:110px"></textarea>`;const t=out.querySelector("textarea");t.value=txt;t.focus();t.select()};
  try{navigator.clipboard.writeText(txt).then(()=>{out.innerHTML=`<p class="small">${L(SHARE.copied)}</p>`},manual)}catch(e){manual()}}}

let CAMPUS=null;
(function(){
  try{const pv=localStorage.getItem("odyssey-campus-preview");if(pv){CAMPUS=JSON.parse(pv);return}}catch(e){}
  if(window.ODYSSEY_CAMPUS){CAMPUS=window.ODYSSEY_CAMPUS;return}
  try{fetch("campus-config.js").then(r=>r.ok?r.text():"").then(t=>{const m=t.match(/ODYSSEY_CAMPUS\s*=\s*(\{[\s\S]*\})\s*;?\s*$/);if(m){CAMPUS=JSON.parse(m[1]);window.__odysseyRedraw&&window.__odysseyRedraw()}}).catch(()=>{})}catch(e){}
})();
const CL={at:{en:"At ",zh:""},atAfter:{en:"",zh:" 的支持服务"},counselling:{en:"Counselling",zh:"心理辅导"},urgent:{en:"Urgent or after hours",zh:"紧急或非工作时间"},health:{en:"Health centre",zh:"健康中心"},international:{en:"International student support",zh:"国际学生支持"},book:{en:"Book online",zh:"在线预约"},

const campusOn=()=>!!(CAMPUS&&CAMPUS.configured);

   <div class="contacts">${rows.map(([k,v])=>`<div class="contact"><div style="min-width:0"><strong>${esc(v.name||pick(CL[k]))}</strong><span class="small" style="display:block">${L(CL[k])}${v.hours?" · "+esc(v.hours):""}</span>${safeUrl(v.booking)?`<a href="${esc(safeUrl(v.booking))}" target="_blank" rel="noopener">${L(CL.book)}</a>`:""}${v.email?` <span class="small" style="user-select:all;overflow-wrap:anywhere">${esc(v.email)}</span>`:""}</div>${v.phone?`<div style="display:flex;gap:8px;align-items:center;flex-shrink:0"><span class="${numCls}">${esc(v.phone)}</span><button class="chip" data-copy="${esc(v.phone)}">${L(T.copy)}</button></div>`:""}</div>`).join("")}</div>
   ${CAMPUS.note&&(CAMPUS.note.en||CAMPUS.note.zh)?`<p class="small">${L({en:CAMPUS.note.en||CAMPUS.note.zh,zh:CAMPUS.note.zh||CAMPUS.note.en})}</p>`:""}
   <p class="small">${L(CL.visa)}</p>`;
}
