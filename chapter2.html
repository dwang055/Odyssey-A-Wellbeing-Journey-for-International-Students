<style>
/* Layout: one cave, one lantern. A single dark world by choice; the canvas is the stage, panels rise from the stone. */
:root{
  --bg:#0c111d; --stone:#222a40; --stone-hi:#36405e; --panel:#151c2e; --line:#2f3a57;
  --mist:#d4def4; --dim:#8e9bba; --lantern:#ffd27d; --thought:#e3808a; --calm:#8fd0bc;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Noto Sans SC",system-ui,sans-serif;
  --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--mist);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;padding-block:12px 24px;display:flex;flex-direction:column;gap:12px;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);letter-spacing:.14em;font-size:12px;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 220px}
.brand .l2{display:none}
.brand b{color:var(--mist);font-weight:700}
.tools{display:flex;gap:6px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 10px;font-size:13px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--stone-hi);color:var(--mist)}
.help{background:none;border:1px solid var(--calm);color:var(--calm);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.zh{font-family:var(--zh)}
.l2{display:block;color:var(--dim);font-size:.9em;font-family:var(--zh)}
h1,h2{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,7vw,40px);letter-spacing:.04em}
h2{font-size:22px}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--lantern)}
p{margin:0}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#070a12;border:1px solid var(--line);touch-action:none}
canvas{display:block;width:100%;height:auto}
.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.hud strong{color:var(--mist)}
.thoughtbar{min-height:58px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--dim);border-radius:10px;padding:10px 12px;font-size:15px}
.thoughtbar.warn{border-left-color:var(--thought)}
.thoughtbar.good{border-left-color:var(--calm)}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center}
.pad button{background:var(--stone);border:1px solid var(--line);border-radius:10px;font-size:20px;color:var(--mist)}
.pad button:active{background:var(--stone-hi)}
.pad .up{grid-column:2}.pad .lf{grid-column:1;grid-row:2}.pad .dn{grid-column:2;grid-row:2}.pad .rt{grid-column:3;grid-row:2}
.note{font-size:12px;color:var(--dim);text-align:center}
/* overlays */
.veil{position:fixed;inset:0;background:rgba(5,8,15,.78);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.veil{align-items:center}}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;max-height:calc(100% - 8px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.btn{background:var(--lantern);color:#1d1606;border:0;border-radius:10px;padding:12px 16px;font-weight:700;text-align:center}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--mist)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 180px}
.quote{font-size:18px;color:var(--thought);border-left:3px solid var(--thought);padding-left:12px}
.valid{font-size:15px;color:var(--calm)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--stone);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;font-size:15px}
.opt:hover{border-color:var(--stone-hi)}
.opt.no{border-color:var(--thought);opacity:.75}
.opt.yes{border-color:var(--calm);background:#1d3332}
.fb{font-size:14px;border-radius:10px;padding:10px 12px;background:#0f1524}
.fb.no{color:#f2b6bc}.fb.yes{color:#bfe9dc}
.tag{display:inline-block;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor;margin-bottom:4px}
.contacts{display:flex;flex-direction:column;gap:8px}
.contact{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--stone);border-radius:10px;padding:10px 12px}
.contact .num{font-family:var(--display);font-size:20px;color:var(--calm);user-select:all;white-space:nowrap}
.small{font-size:13px;color:var(--dim)}
textarea{width:100%;min-height:90px;background:#0f1524;color:var(--mist);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical;box-sizing:border-box}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--stone);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--lantern);color:var(--lantern)}
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.circle{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--lantern),rgba(255,210,125,.15) 70%);transform:scale(.45);transition:transform 4s ease-in-out}
.bcount{font-family:var(--display);font-size:20px;letter-spacing:.1em}
.summary li{margin-bottom:6px}
.summary{padding-left:18px;margin:0}
@media (prefers-reduced-motion:reduce){.circle{transition:none}}

.skill{border-radius:14px;padding:16px;background:linear-gradient(135deg,#1c2a4a,#3f74c4);color:#fff;display:flex;flex-direction:column;gap:6px}
.skill .l2{color:rgba(255,255,255,.82)}
.skill-k{font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#ffd27d}
.skill-t{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.2}
.skill-f{font-family:var(--display);font-size:11px;letter-spacing:.2em;opacity:.7;margin-top:4px}
.share{display:flex;flex-direction:column;gap:8px}
</style>

  opened=new Set();orbsGot=0;chosen=[];orbIdx=0;done=false;moving=false;pick2={};"ABCD".split("").forEach(k=>pick2[k]=Math.random()<.5);
  grid.forEach((r,y)=>r.forEach((c,x)=>{if(c==="S"){player={x,y};grid[y][x]="."}}));
  target={...player};light=lightGoal=3;cam=player.y;
  updateHud();setBar("calm",T.start);
}
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let cell=40,cam=0;
function resize(){
  const w=Math.min(document.getElementById("stage").clientWidth,560);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cell=w/W;
  cv.width=Math.round(w*dpr);cv.height=Math.round(cell*VIEW_ROWS*dpr);
  cv.style.height=(cell*VIEW_ROWS)+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
const hash=(x,y,s=0)=>{let h=(x*374761393+y*668265263+s*2147483647)>>>0;h=(h^(h>>>13))*1274126177>>>0;return (h&1023)/1023};
function shade(base,v){return `hsl(${base[0]},${base[1]}%,${base[2]+v}%)`}
let t0=performance.now(),lastT=performance.now();
const parts=FX.Particles();
function draw(now){
  const t=RM?0:(now-t0)/1000;const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  light+= (lightGoal-light)*0.06;
  // tween player
  if(moving){const dx=target.x-player.x,dy=target.y-player.y;
    if(Math.abs(dx)+Math.abs(dy)<0.04){player.x=target.x;player.y=target.y;moving=false;arrive();}
    else{player.x+=dx*0.32;player.y+=dy*0.32}}
  const maxCam=H-VIEW_ROWS/2, minCam=VIEW_ROWS/2;
  const goal=Math.max(minCam,Math.min(maxCam,player.y+0.5));
  cam+=(goal-cam)*0.12;
  const oy=(VIEW_ROWS/2-cam)*cell;
  const vw=cell*W,vh=cell*VIEW_ROWS;
  ctx.fillStyle="#0a0e18";ctx.fillRect(0,0,vw,vh);
  const y0=Math.max(0,Math.floor(cam-VIEW_ROWS/2)-1),y1=Math.min(H,Math.ceil(cam+VIEW_ROWS/2)+1);
  for(let y=y0;y<y1;y++)for(let x=0;x<W;x++){
    const c=grid[y][x],px=x*cell,py=y*cell+oy;
    if(c==="#"){ // faceted low-poly stone
      const a=hash(x,y)*8,b=hash(x,y,1)*8;
      ctx.fillStyle=shade([226,26,34],a);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+cell,py);ctx.lineTo(px,py+cell);ctx.fill();
      ctx.fillStyle=shade([228,26,27],b);ctx.beginPath();ctx.moveTo(px+cell,py);ctx.lineTo(px+cell,py+cell+0.5);ctx.lineTo(px,py+cell+0.5);ctx.fill();
    } else {
      ctx.fillStyle=(x+y)%2?"#131a2c":"#111727";ctx.fillRect(px,py,cell+0.5,cell+0.5);
      if(hash(x,y,3)>0.7){ctx.fillStyle="#1c2336";ctx.fillRect(px+cell*hash(x,y,4),py+cell*hash(x,y,5),2,2)}
      if(/[A-D]/.test(c)){ // thought wall
        const p=0.55+0.25*Math.sin(t*2+x);
        ctx.fillStyle=`rgba(227,128,138,${0.25+p*0.25})`;ctx.fillRect(px,py,cell,cell);
        ctx.strokeStyle=`rgba(255,170,178,${p})`;ctx.lineWidth=1.5;ctx.beginPath();
        ctx.moveTo(px+cell*.2,py+cell*.15);ctx.lineTo(px+cell*.45,py+cell*.5);ctx.lineTo(px+cell*.3,py+cell*.85);
        ctx.moveTo(px+cell*.45,py+cell*.5);ctx.lineTo(px+cell*.8,py+cell*.35);ctx.stroke();
      }
      if(c==="o"){const r=cell*(0.16+0.03*Math.sin(t*3+y));
        const g=ctx.createRadialGradient(px+cell/2,py+cell/2,0,px+cell/2,py+cell/2,cell*0.5);
        g.addColorStop(0,"rgba(212,232,255,.95)");g.addColorStop(1,"rgba(212,232,255,0)");
        ctx.fillStyle=g;ctx.fillRect(px,py,cell,cell);ctx.fillStyle="#eef5ff";ctx.beginPath();ctx.arc(px+cell/2,py+cell/2,r,0,7);ctx.fill();}
      if(c==="X"){const g=ctx.createLinearGradient(px,py,px+cell,py);g.addColorStop(0,"rgba(255,210,125,.2)");g.addColorStop(1,"rgba(255,240,200,.9)");ctx.fillStyle=g;ctx.fillRect(px,py,cell,cell);}
    }
  }
  // player soul
  const cx=(player.x+.5)*cell,cy=(player.y+.5)*cell+oy;
  // darkness with lantern hole
  const R=light*cell*(1+(RM?0:0.025*Math.sin(now/90)+0.018*Math.sin(now/37)));
  const dg=ctx.createRadialGradient(cx,cy,R*0.5,cx,cy,R*1.3);
  dg.addColorStop(0,"rgba(4,6,12,0)");dg.addColorStop(1,`rgba(4,6,12,${done?0.12:Math.max(.3,0.64-opened.size*0.08)})`);
  ctx.fillStyle=dg;ctx.fillRect(0,0,vw,vh);
  // faint beacons, so the way forward is never invisible
  if(!done)for(let y=y0;y<y1;y++)for(let x=0;x<W;x++){const c=grid[y][x];if(c==="."||c==="#")continue;
    const bx=(x+.5)*cell,by=(y+.5)*cell+oy,col=/[A-D]/.test(c)?"240,140,150":c==="X"?"255,226,150":"212,232,255";
    const pu=.3+.12*Math.sin(t*2+x+y),bg=ctx.createRadialGradient(bx,by,0,bx,by,cell*.85);
    bg.addColorStop(0,`rgba(${col},${pu})`);bg.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=bg;ctx.fillRect(bx-cell,by-cell,cell*2,cell*2)}
  // drifting motes and bursts
  if(!done&&Math.random()<.1)parts.spawn((player.x+.5)*cell,(player.y+.5)*cell,1,{speed:7,life:3.5,size:1.5,color:"255,226,170",jitter:cell*4});
  parts.draw(ctx,dt,0,oy);
  const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,cell*0.9);
  glow.addColorStop(0,"rgba(255,226,150,.35)");glow.addColorStop(1,"rgba(255,210,125,0)");
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,cell*0.9,0,7);ctx.fill();
  healV+=((done&&!DONE0?Math.min(1,H0+1/3):H0)-healV)*(RM?1:.03);
  FX.drawTraveller(ctx,cx,cy+cell*.45,cell*.95,{heal:healV,t,walk:moving,face:faceX});
  requestAnimationFrame(draw);
}

/* ---------- movement ---------- */
function tryMove(dx,dy){
  if(moving||done||!veil.hidden) return;
  const nx=target.x+dx,ny=target.y+dy,c=grid[ny]?.[nx];
  if(!c||c==="#") return;
  if(dx)faceX=dx;
  if(/[A-D]/.test(c)){openThought(c,nx,ny);return}
  target={x:nx,y:ny};moving=true;
}
function arrive(){
  const c=grid[player.y][player.x];
  if(c==="o"){grid[player.y][player.x]=".";parts.spawn((player.x+.5)*cell,(player.y+.5)*cell,26,{speed:65,life:1.1,size:2.6,color:"220,236,255"});FX.sfx("orb");orbsGot++;lightGoal+=0.3;updateHud();
    setBar("good",{en:T.orbGot.en+" "+ORB_LINES[orbIdx].en,zh:T.orbGot.zh+ORB_LINES[orbIdx].zh});orbIdx++;return}
  if(c==="X"){finish();return}
  const n=adjThought();
  if(n) setBar("warn",{en:T.near.en+" “"+TH(n).text.en+"” "+T.face.en,zh:T.near.zh+"“"+TH(n).text.zh+"”"+T.face.zh});
}
function adjThought(){for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const c=grid[player.y+dy]?.[player.x+dx];if(c&&/[A-D]/.test(c))return c}return null}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA")return;
  const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(k){e.preventDefault();tryMove(...k)}
  if(e.key==="Escape"&&!veil.hidden&&closable)closeSheet();
});
let held=null,holdTimer=null;
document.querySelectorAll(".pad button").forEach(b=>{
  const d=b.dataset.d.split(",").map(Number);
  b.addEventListener("pointerdown",e=>{e.preventDefault();tryMove(...d);clearInterval(holdTimer);holdTimer=setInterval(()=>tryMove(...d),170)});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>clearInterval(holdTimer)));
});
let sx,sy;
cv.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY});
cv.addEventListener("pointerup",e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  Math.abs(dx)>Math.abs(dy)?tryMove(Math.sign(dx),0):tryMove(0,Math.sign(dy))});

let breathTimer=null;
function breathe(){
  let step=0,total=12; // 4 cycles x 3 phases
  const phases=[["breathIn",4,1],["breathHold",2,1],["breathOut",4,.45]];
  openSheet(()=>{sheet.innerHTML=`<div class="breath"><div class="circle" id="circ"></div><div class="bcount" id="bl"></div>
    <p class="small" style="text-align:center">${L(T.breathNote)}</p>
    <button class="btn ghost" id="b-skip">${L(T.skip)}</button></div>`;
    sheet.querySelector("#b-skip").onclick=()=>{clearTimeout(breathTimer);closeSheet()};
    show();},false);
  function show(){const [k,s,scale]=phases[step%3];const c=document.getElementById("circ"),l=document.getElementById("bl");
    if(!c)return;c.style.transitionDuration=s+"s";c.style.transform=`scale(${scale})`;l.innerHTML=L(T[k]);}
  function tick(){const s=phases[step%3][1];breathTimer=setTimeout(()=>{step++;if(step>=total){closeSheet();return}show();tick()},s*1000)}
  requestAnimationFrame(()=>requestAnimationFrame(()=>{show();tick()}));
}
